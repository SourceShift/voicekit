name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: msrv (1.85, cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rust-version` promises 1.85 for the libraries and binaries. Dev-only
      # dependencies (proptest) declare a newer MSRV and are excluded, so the
      # check runs without dev-deps.
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --lib --bins

  test:
    name: test (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The default turn must run with no Python process and no network.
      - run: cargo run -q -p voicekit-cli -- demo --fake

  docs:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet pytest ruff
      # F/E9 catch undefined names and syntax errors without imposing style.
      - run: ruff check --select E9,F sdks/python
      - run: PYTHONPATH=sdks/python python -m pytest sdks/python/tests -q

  sidecar:
    name: sidecar (same turn through the plugin)
    needs: [test, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo run -q -p voicekit-cli -- demo --sidecar

  package:
    name: package metadata
    needs: [clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A crate can test green and still be unpublishable. Only the leaf crate
      # can be packaged before the first release (dependents resolve their
      # siblings from crates.io), so the rest is checked statically.
      - name: package leaf crate
        run: cargo package -p voicekit-core --no-verify
      - name: check publishable metadata
        run: |
          python3 - <<'PY'
          import pathlib, sys, tomllib

          root = pathlib.Path(".")
          manifest = tomllib.loads((root / "Cargo.toml").read_text())
          members = manifest["workspace"]["members"]
          crates = {
              tomllib.loads((root / m / "Cargo.toml").read_text())["package"]["name"]
              for m in members
          }

          problems = []
          for member in members:
              data = tomllib.loads((root / member / "Cargo.toml").read_text())
              package = data["package"]
              for field in ("description", "license", "readme", "repository"):
                  if field not in package:
                      problems.append(f"{member}: missing package.{field}")
              for section in ("dependencies", "dev-dependencies", "build-dependencies"):
                  for name, spec in data.get(section, {}).items():
                      if name in crates and isinstance(spec, dict) and "path" in spec:
                          if "version" not in spec:
                              problems.append(
                                  f"{member}: sibling dependency {name} has a path "
                                  "but no version, so it cannot be published"
                              )

          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print(f"metadata ok for {len(members)} crates")
          PY

  deny:
    name: cargo-deny (licenses, advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error

  semver:
    name: semver (API compatibility)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-rev: ${{ github.event.pull_request.base.sha }}

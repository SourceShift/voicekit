name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_crates:
        description: Publish the crates to crates.io
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: PYTHONPATH=sdks/python python -m pytest sdks/python/tests -q
      - run: cargo run -q -p voicekit-cli -- demo --fake
      - run: cargo run -q -p voicekit-cli -- demo --sidecar

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p voicekit-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          name="voicekit-cli-${GITHUB_REF_NAME}-${{ matrix.target }}"
          tar -czf "dist/${name}.tar.gz" -C "target/${{ matrix.target }}/release" voicekit-cli
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    # A release only makes sense for a tag; workflow_dispatch may publish
    # crates without creating a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish:
    name: publish crates
    needs: verify
    # Tag pushes publish; a manual run publishes only when asked.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_crates
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)

          version_of() {
            echo "$metadata" | jq -r --arg n "$1" \
              '.packages[] | select(.name == $n) | .version'
          }

          publish_with_retry() {
            local crate=$1
            for attempt in 1 2 3; do
              if cargo publish -p "$crate"; then
                return 0
              fi
              echo "publish $crate failed (attempt $attempt); waiting for the index to catch up"
              sleep 60
            done
            return 1
          }

          # core -> ipc -> providers -> runtime -> sidecar -> cli.
          for crate in voicekit-core voicekit-ipc voicekit-providers \
                       voicekit-runtime voicekit-sidecar voicekit-cli; do
            version=$(version_of "$crate")
            if cargo search "$crate" --limit 1 2>/dev/null \
                 | grep -q "^$crate = \"$version\""; then
              echo "$crate $version is already on crates.io; skipping"
              continue
            fi
            publish_with_retry "$crate"
            # crates.io needs a moment before dependents can resolve it.
            sleep 45
          done
